name: Generate design write-up PDF

on:
  push:
    branches: [main]
    paths:
      - 'GRIT_Interview_Design_Writeup.md'
      - 'generate_writeup_pdf.py'
      - '.github/workflows/generate-writeup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-writeup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF generator
        run: python -m pip install reportlab
      - name: Produce PDF
        run: python generate_writeup_pdf.py
      - name: Commit generated document
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GRIT_Interview_Design_Writeup.pdf
          git diff --cached --quiet || (git commit -m "Generate two-page submission PDF" && git push)
